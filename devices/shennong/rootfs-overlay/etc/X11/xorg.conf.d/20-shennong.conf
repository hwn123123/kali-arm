Section "Files"
    ModulePath "/usr/local/lib/xorg-shennong/modules"
    ModulePath "/usr/lib/xorg/modules"
EndSection

Section "Device"
    Identifier "Shennong display"
    Driver "modesetting"
    Option "AccelMethod" "none"
    Option "ShadowFB" "true"
    Option "SWcursor" "true"
    Option "Monitor-Virtual-1" "Shennong virtual 1"
    Option "Monitor-Virtual-2" "Shennong virtual 2"
    Option "Monitor-DSI-1" "Shennong panel"
EndSection

Section "Monitor"
    Identifier "Shennong virtual 1"
    Option "Ignore" "true"
EndSection

Section "Monitor"
    Identifier "Shennong virtual 2"
    Option "Ignore" "true"
EndSection

Section "Monitor"
    Identifier "Shennong panel"
    Option "Primary" "true"
    Option "PreferredMode" "1440x3200x60cmd"
EndSection

Section "Extensions"
    Option "MIT-SHM" "Disable"
EndSection
